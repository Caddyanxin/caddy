<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caddy</title>
<style>
  :root{
    --paper:#F7F4EC;
    --surface:#FFFDF7;
    --ink:#22261F;
    --ink-2:#3E443A;
    --muted:#7B7668;
    --rule:#DDD5C1;
    --rule-soft:#E8E1D0;
    --ochre:#A8763E;
    --sage:#6F7F63;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(34,38,31,.045) .6px,transparent .6px);
    background-size:8px 8px;
    padding:0 0 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 34px}

  /* ── 顶栏 ── */
  .top{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:30px 0 0;
  }
  .top .name{font-family:var(--serif);font-size:16px;letter-spacing:.22em}
  .top .meta{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted)}

  /* ── 头图区 ── */
  .intro{padding:56px 0 0}
  .intro h1{
    font-family:var(--serif);font-weight:400;
    font-size:30px;line-height:1.6;letter-spacing:.03em;
    color:var(--ink);
  }
  .intro h1 .wx{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
    color:var(--muted);margin-left:16px;vertical-align:middle;
  }
  .lede-line{
    margin-top:14px;
    font-size:14.5px;line-height:1.95;color:var(--ink-2);
    text-align:justify;
  }
  .tags{
    margin-top:26px;display:flex;flex-wrap:wrap;gap:0;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  }
  .tags span{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);
    padding:10px 18px 10px 0;margin-right:18px;border-right:1px solid var(--rule-soft);
  }
  .tags span:last-child{border-right:0;margin-right:0}

  /* ── 卡片墙 ── */
  .wall{
    margin-top:34px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  }
  .c{
    text-align:left;cursor:pointer;font:inherit;color:inherit;
    background:var(--surface);border:1px solid var(--rule);
    padding:22px 22px 20px;min-height:172px;
    display:flex;flex-direction:column;
    transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  }
  .c:hover{
    border-color:var(--ochre);transform:translateY(-3px);
    box-shadow:0 12px 26px -18px rgba(34,38,31,.45);
  }
  .c:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  .c .tag{
    font-family:var(--mono);font-size:9px;letter-spacing:.26em;
    color:var(--ochre);text-transform:uppercase;
  }
  .c .t{
    font-family:var(--serif);font-size:20px;line-height:1.55;
    letter-spacing:.03em;margin-top:11px;
  }
  .c .d{
    margin-top:auto;padding-top:14px;
    font-size:12.5px;line-height:1.85;color:var(--muted);
  }
  .c.wide{grid-column:span 3;min-height:0;padding-bottom:26px}
  .c.wide .t{font-size:26px;margin-top:10px}
  .c .tw{
    font-family:var(--mono);font-size:14px;letter-spacing:.12em;
    color:#0B0D08;margin-left:12px;vertical-align:middle;
  }
  .years{
    margin-top:20px;display:flex;flex-wrap:wrap;gap:0;
    border-top:1px solid var(--rule-soft);
  }
  .years i{
    font-style:normal;font-family:var(--mono);font-size:10px;
    letter-spacing:.1em;color:var(--muted);
    padding:11px 16px 0 0;margin-right:16px;
    border-right:1px solid var(--rule-soft);
  }
  .years i:last-child{border-right:0}
  .years i b{color:var(--ink);font-weight:400;margin-right:7px}

  .hint{
    margin-top:34px;text-align:center;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--muted);
  }

  /* ── 阅读层 ── */
  .reader{
    position:fixed;inset:0;z-index:30;display:none;
    background:rgba(34,38,31,.32);backdrop-filter:blur(3px);
    padding:24px;
  }
  .reader.on{display:block}
  .sheet{
    position:relative;max-width:720px;margin:0 auto;
    max-height:calc(100vh - 48px);overflow-y:auto;
    background:var(--surface);border:1px solid var(--rule);
    padding:44px 50px 48px;
    box-shadow:0 40px 90px -40px rgba(34,38,31,.5);
    animation:rise .28s cubic-bezier(.22,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .sheet .x{
    position:absolute;top:14px;right:16px;
    border:0;background:transparent;cursor:pointer;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--muted);
    padding:8px;
  }
  .sheet .x:hover{color:var(--ochre)}

  .k{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--ochre);text-transform:uppercase}
  .h{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.5;letter-spacing:.03em;margin-top:10px}
  .lede{margin-top:16px;font-size:15px;line-height:2;color:var(--ink)}

  .list{margin-top:28px;border-top:1px solid var(--rule)}
  .li{
    display:grid;grid-template-columns:88px 1fr;gap:18px;
    padding:13px 0;border-bottom:1px solid var(--rule-soft);
  }
  .li b{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:.04em;padding-top:1px}
  .li span{font-size:13px;line-height:1.95;color:var(--ink-2)}

  .tl{margin-top:26px;border-top:1px solid var(--rule)}
  .tl .r{
    display:grid;grid-template-columns:100px 1fr;gap:18px;
    padding:12px 0;border-bottom:1px solid var(--rule-soft);
  }
  .tl .y{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);padding-top:3px}
  .tl .cell b{font-size:13px;font-weight:500;color:var(--ink)}
  .tl .cell span{display:block;margin-top:4px;font-size:12.5px;line-height:1.8;color:var(--muted)}
  .tl .cell{cursor:pointer}
  body.editing .tl .cell{cursor:text}
  .note{
    margin-top:12px;font-family:var(--sans);font-weight:500;
    font-size:12.5px;line-height:1.7;color:var(--ink);
  }
  .co-t{
    margin-top:8px;padding:0 0 2px;border:0;background:none;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    color:var(--ochre);border-bottom:1px dotted rgba(168,118,62,.55);
  }
  .co-t:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .co-t::after{content:" +"}
  .co-t.on::after{content:" −"}
  .co{display:none;margin-top:10px;padding:11px 13px;
    border-left:2px solid var(--rule-soft);background:rgba(35,42,38,.028)}
  .co.on{display:block}
  .co dl{margin:0}
  .co dt{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted)}
  .co dt+dd{margin:2px 0 9px;font-size:12.5px;line-height:1.85;color:var(--ink-2)}
  .co dt:last-of-type+dd{margin-bottom:0}

  .res{
    margin-top:26px;padding:14px 16px;border-left:2px solid var(--ochre);
    background:rgba(168,118,62,.05);
    font-size:13px;line-height:1.95;color:var(--ink-2);
  }
  .res b{
    display:block;font-family:var(--mono);font-weight:400;
    font-size:8.5px;letter-spacing:.24em;color:var(--ochre);
    text-transform:uppercase;margin-bottom:6px;
  }
  .ph{
    color:var(--ochre);border-bottom:1px dashed var(--ochre);
    padding:0 3px;
  }

  .rel{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
    font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);
  }
  .rel button{
    border:0;background:transparent;cursor:pointer;padding:0 0 2px;
    font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;color:var(--ink);
    border-bottom:1px solid var(--rule);
  }
  .rel button:hover{color:var(--ochre);border-bottom-color:var(--ochre)}

  /* ── 窄屏 ── */
  @media (max-width:900px){
    .wall{grid-template-columns:repeat(2,1fr)}
    .c.wide{grid-column:span 2}
    .intro h1{font-size:24px}
  }
  @media (max-width:620px){
    .wrap{padding:0 20px}
    .top{padding-top:22px}
    .intro{padding-top:36px}
    .intro h1{font-size:21px;line-height:1.95}
    .wall{grid-template-columns:1fr;gap:12px}
    .c.wide{grid-column:span 1}
    .c{min-height:0}
    .c .d{padding-top:12px}
    .reader{padding:12px}
    .sheet{max-height:calc(100vh - 24px);padding:38px 24px 36px}
    .h{font-size:26px}
    .li{grid-template-columns:78px 1fr;gap:12px}
    .tl .r{grid-template-columns:80px 1fr;gap:12px}
  }

  /* ── 编辑 ── */
  .ebar{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:80}
  .ebar button{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    padding:9px 14px;border:1px solid var(--rule);background:var(--surface);
    color:var(--ink-soft);cursor:pointer;border-radius:2px;
  }
  .ebar button:hover{border-color:var(--ochre);color:var(--ochre)}
  .ebar button.on{background:var(--ochre);color:#fff;border-color:var(--ochre)}
  body.editing [contenteditable="true"]{outline:1px dashed rgba(168,118,62,.45);outline-offset:4px;cursor:text}
  body.editing [contenteditable="true"]:focus{outline:1px solid var(--ochre);background:rgba(168,118,62,.05)}
  body.editing .wall .c{cursor:text}
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <div class="name">Caddy</div>
  </div>

  <section class="intro">
    <h1>电商项目经理<span class="wx">WeChat　Caddy1142</span></h1>
    <p class="lede-line">负责品牌官方旗舰店整体经营，涵盖项目成本核算、货品规划、供应链协同、前端店铺经营与投放，从 0 搭建执行团队并组织协调落地。具备品牌方与服务方双背景，主导跨部门沟通与资源协调。</p>
    <p class="lede-line">以成本、利润与投入产出为经营依据：单月 GMV 最高 5000 万，单场最高 600 万，累计投放消耗 2000 万+，单月增长最高 692%。</p>
    <div class="tags">
      <span>策略与商品</span><span>供应链与资源</span><span>内容与 AI 流程</span><span>团队与激励</span><span>数据与复盘</span><span>沟通协调</span><span>项目统筹</span><span>经营与投入产出</span>
    </div>
  </section>

  <div class="wall">

    <button class="c wide" data-go="0">
      <span class="tag">路径</span>
      <span class="t">2021 — 2026<span class="tw">（点击展开）</span></span>
      <span class="d">服务方与品牌方双重背景，熟悉项目的完整周期。</span>
      <div class="years">
        <i><b>2021</b>严品传媒</i>
        <i><b>22—24</b>热风官旗</i>
        <i><b>2025</b>ONLY·绫致</i>
        <i><b>2026</b>森林地带</i>
        <i><b>Now</b>独立协作</i>
      </div>
    </button>

    <button class="c" data-go="1">
      <span class="tag">策略</span>
      <span class="t">策略规划与商品判断</span>
      <span class="d">负责经营目标拆解、货品结构规划与季度上新决策。</span>
    </button>

    <button class="c" data-go="2">
      <span class="tag">供应链</span>
      <span class="t">供应链与资源协同</span>
      <span class="d">负责供应商评估、打样排产与品质管控，统筹定价与库存。</span>
    </button>

    <button class="c" data-go="3">
      <span class="tag">内容</span>
      <span class="t">内容生产与素材体系</span>
      <span class="d">负责内容生产流程与素材资产管理，含 AI 辅助环节。</span>
    </button>

    <button class="c" data-go="4">
      <span class="tag">团队</span>
      <span class="t">团队搭建与激励</span>
      <span class="d">负责执行团队搭建，覆盖岗位设计与激励方案。</span>
    </button>

    <button class="c" data-go="5">
      <span class="tag">数据</span>
      <span class="t">数据运营与复盘</span>
      <span class="d">负责流量结构、用户结构与转化效率分析，并据此调整策略。</span>
    </button>

    <button class="c" data-go="6">
      <span class="tag">沟通</span>
      <span class="t">沟通协调与项目推进</span>
      <span class="d">负责内外部沟通与节点推进，协调品牌方、供应链与平台。</span>
    </button>

    <button class="c" data-go="7">
      <span class="tag">统筹</span>
      <span class="t">项目统筹与体系搭建</span>
      <span class="d">负责项目整体统筹与执行体系搭建，涵盖人、货、场、品、效。</span>
    </button>

    <button class="c" data-go="8">
      <span class="tag">经营</span>
      <span class="t">经营与投入产出</span>
      <span class="d">负责成本、利润与投入产出核算，参与预算与定价决策。</span>
    </button>

    <button class="c" data-go="9">
      <span class="tag">未完</span>
      <span class="t">未完待续</span>
      <span class="d">后续经历待补充。</span>
    </button>

  </div>

  <div class="hint">点开看　·　ESC 合上</div>

</div>

<!-- ══ 阅读层 ══ -->
<div class="reader" id="reader">
  <div class="sheet">
    <button class="x" id="close">CLOSE</button>
    <div id="content"></div>
  </div>
</div>

<!-- ══ 卡片内容 ══ -->
<template id="e0">
  <div class="k">路径</div>
  <div class="h">2021 — 2026</div>
  <p class="lede">具备品牌方与服务方双重背景，熟悉品牌侧的决策链路与目标口径，也清楚服务方在交付、协作与资源调度上的实际运作方式。</p>
  <p class="note">各段可展开公司背景，含公司性质与业务构成。</p>
  <div class="tl">
    <div class="r"><div class="y">2021</div><div class="cell">
      <b>严品传媒 · 星期六 / 千百度</b>
      <span>负责星期六、千百度双品牌电商直播项目统筹。</span>
      <button class="co-t" data-co>公司背景</button>
      <div class="co">
        <dl>
          <dt>严品传媒</dt>
          <dd>杭州头部直播电商服务商（DP），为品牌做代运营。业务含店铺代运营、直播间搭建、内容生产、投放代投，服务对象以鞋服品牌为主。</dd>
          <dt>星期六</dt>
          <dd>女鞋品牌，A 股上市。产品以时尚女鞋为主，单鞋、靴、凉鞋按季节铺，价格带偏大众。线下百货渠道起家，后主业转向直播电商，更名遥望科技。</dd>
          <dt>千百度</dt>
          <dd>女鞋品牌，港股上市。产品偏都市通勤与商务，皮鞋、靴类占大头，价格带中高。线下门店与电商并行。</dd>
          <dt>我在这段</dt>
          <dd>负责星期六、千百度双品牌电商直播项目的整体统筹：拆解销售与场次目标，编排直播排期，协调物料、场地与执行人员；前期完成人员储备与货品排期，并与品牌方对齐大促节点。</dd>
        </dl>
      </div>
    </div></div>
    <div class="r"><div class="y">2022—24</div><div class="cell">
      <b>热风 Hotwind 官方旗舰店</b>
      <span>负责官方旗舰店项目由代运营转向公司自营。</span>
      <button class="co-t" data-co>公司背景</button>
      <div class="co">
        <dl>
          <dt>热风 Hotwind</dt>
          <dd>上海热风，快时尚服饰集合店。自有品牌、自有渠道，门店起家，品类覆盖鞋、服装、配饰，客群偏年轻大众。</dd>
          <dt>项目背景</dt>
          <dd>公司推进自营战略，将原先交由外部 DP 的官方旗舰店运营权限收回，转由内部团队承接。</dd>
          <dt>我在这段</dt>
          <dd>负责官方旗舰店自营运营，统筹货品、内容、投放与团队，并承担项目测算：广告费预算、大促投入、KOL 合作成本与预期产出，核算利润率与回收周期，据此排布投放与活动节奏。</dd>
        </dl>
      </div>
    </div></div>
    <div class="r"><div class="y">2025</div><div class="cell">
      <b>ONLY · 绫致中国</b>
      <span>负责品牌自营序列华南大区店铺运营。</span>
      <button class="co-t" data-co>公司背景</button>
      <div class="co">
        <dl>
          <dt>ONLY</dt>
          <dd>丹麦 Bestseller 集团旗下女装品牌，中国运营主体为绫致时装。集团下还有 VERO MODA、JACK &amp; JONES 等，多品牌独立运营，共享供应链与中后台。</dd>
          <dt>两条线</dt>
          <dd>ONLY 的电商分两个体系：一部分旗舰店由 DP 承接，另一部分为品牌自营序列。本段岗位属自营序列。</dd>
          <dt>华南大区</dt>
          <dd>大区内部按店铺划分。线上店铺与线下零售门店并行，货品结构、活动节奏与库存需两侧对齐。</dd>
          <dt>我在这段</dt>
          <dd>负责华南大区线上店铺的运营统筹，推进跨部门节点落地；协调线上店铺与线下零售门店在货品、活动与库存上的对齐。</dd>
        </dl>
      </div>
    </div></div>
    <div class="r"><div class="y">2026</div><div class="cell">
      <b>森林地带 官方旗舰店</b>
      <span>负责品牌项目从立项规划到销售落地。</span>
      <button class="co-t" data-co>公司背景</button>
      <div class="co">
        <dl>
          <dt>福建九鹏生物科技</dt>
          <dd>森林地带为其自有品牌，主营户外用品。品类跨度较大，驱蚊液、帐篷、冲锋衣等快消与耐用品并行。</dd>
          <dt>立项与规划</dt>
          <dd>项目立项阶段即介入，与市场部共同完成前期规划：品牌定位、目标人群、渠道与节奏。</dd>
          <dt>市场调研</dt>

<script>
(function(){
  var reader  = document.getElementById('reader');
  var content = document.getElementById('content');

  function open(i){
    var tpl = document.getElementById('e' + i);
    if(!tpl) return;
    content.innerHTML = '';
    content.appendChild(tpl.content.cloneNode(true));
    reader.classList.add('on');
    reader.querySelector('.sheet').scrollTop = 0;
  }

  window.caddyOpen = open;

  function close(){
    reader.classList.remove('on');
  }

  document.addEventListener('click', function(e){
    var go = e.target.closest('[data-go]');
    if(go){ open(go.getAttribute('data-go')); return; }
    var co = e.target.closest('[data-co]');
    if(co){
      co.classList.toggle('on');
      var box = co.parentNode.querySelector('.co');
      if(box) box.classList.toggle('on');
      return;
    }
    var cell = e.target.closest('.tl .cell');
    if(cell && !e.target.closest('.co') && !document.body.classList.contains('editing')){
      var t = cell.querySelector('.co-t'), b = cell.querySelector('.co');
      if(t && b){ t.classList.toggle('on'); b.classList.toggle('on'); return; }
    }
    if(e.target === reader || e.target.id === 'close') close();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') close();
  });
})();
</script>

<div class="ebar">
  <button id="edToggle">编辑</button>
  <button id="edSave">下载副本</button>
</div>

<script>
(function(){
  var body = document.body;

  // 按钮换成 div，文字才能直接改
  document.querySelectorAll('.wall button.c').forEach(function(b){
    var d = document.createElement('div');
    for(var i=0;i<b.attributes.length;i++){
      var a = b.attributes[i];
      if(a.name !== 'class') d.setAttribute(a.name, a.value);
    }
    d.className = b.className;
    d.setAttribute('role','button');
    d.setAttribute('tabindex','0');
    d.innerHTML = b.innerHTML;
    b.parentNode.replaceChild(d, b);
  });

  var editing = false;

  function hosts(){
    return document.querySelectorAll('.name, .intro, .wall .c .tag, .wall .c .t, .wall .c .d, .wall .c .years, #content');
  }

  function setEd(v){
    editing = v;
    body.classList.toggle('editing', v);
    hosts().forEach(function(el){
      if(v) el.setAttribute('contenteditable','true');
      else el.removeAttribute('contenteditable');
    });
    var t = document.getElementById('edToggle');
    t.textContent = v ? '编辑中' : '编辑';
    t.classList.toggle('on', v);
  }

  document.getElementById('edToggle').addEventListener('click', function(e){
    e.stopPropagation();
    setEd(!editing);
  });

  // 编辑时单击只落光标，双击才打开卡片
  document.addEventListener('click', function(e){
    if(!editing) return;
    if(e.target.closest('.ebar')) return;
    if(e.target.closest('.co-t')) return;
    var reading = document.getElementById('reader').classList.contains('on');
    if(!reading && e.target.closest('.wall .c')){ e.stopPropagation(); }
    if(reading && e.target.closest('#content [data-go]')){ e.stopPropagation(); }
  }, true);

  document.addEventListener('dblclick', function(e){
    if(!editing) return;
    var c = e.target.closest('.wall .c');
    if(c && c.getAttribute('data-go') !== null) window.caddyOpen(parseInt(c.getAttribute('data-go'),10));
  });

  document.getElementById('edSave').addEventListener('click', function(){
    var clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(function(el){ el.removeAttribute('contenteditable'); });
    var w = clone.querySelector('body'); if(w) w.classList.remove('editing');
    var t = clone.querySelector('#edToggle'); if(t){ t.textContent='编辑'; t.classList.remove('on'); }
    var r = clone.querySelector('#reader'); if(r) r.classList.remove('on');
    var cn = clone.querySelector('#content'); if(cn) cn.innerHTML = '';
    clone.querySelectorAll('.co.on, .co-t.on').forEach(function(el){ el.classList.remove('on'); });
    var html = '<!DOCTYPE html>\n' + clone.outerHTML;
    var blob = new Blob([html], {type:'text/html;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Caddy.html';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });
})();
</script>
